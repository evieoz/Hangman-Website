<!doctype html>
<html lang="en">

<head>
    <title>Cherry Blossom Hangman</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container text-center">

        <h1 class="mb-4">Cherry Blossom Hangman</h1>

        <!-- Difficulty Selection -->
        <div id="difficultySelection">
            <h3>Select Difficulty</h3>

            <button class="btn btn-outline-success difficulty-btn" onclick="startGame('easy')">
                Easy
            </button>

            <button class="btn btn-outline-warning difficulty-btn" onclick="startGame('medium')">
                Medium
            </button>

            <button class="btn btn-outline-danger difficulty-btn" onclick="startGame('hard')">
                Hard
            </button>
        </div>

        <div id="difficultyBox" class="mt-3 p-3 fw-bold d-none">
             Difficulty: <span id="difficultyText"></span>
        </div>

        <!-- Game Area -->
        <div id="gameArea" class="mt-4 d-none">
            <h2 id="wordDisplay" class="mb-3">_ _ _ _ _</h2>
            <div class="mb-3">
                <input type="text" id="letterInput" maxlength="1" class="form-control d-inline-block w-auto"
                    placeholder="Enter a Letter">
                <button id="guessBtn" class="btn btn-warning" onclick="guessLetter()">
                    Guess
                </button>
            </div>

            <!-- Guessed Letters -->
            <p id="guessedLetters" class="fw-bold"></p>

            <!-- Mistakes -->
            <p id="mistakes" class="fw-bold text-danger"></p>

            <!-- Win or Lose Message -->
            <p id="message" class="fw-bold mt-3"></p>

            <img src="tree6.png" alt="Cherry Blossom Tree" id="tree" class="tree-img">

            <!-- Restart Button -->
            <div class="mt-4">
                <button id="restartBtn" class="btn btn-danger" onclick="restartGame()">
                    Restart Game
                </button>
            </div>

        </div>

    </main>

    <footer></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
